name: Build Smart Nutrition APK
​on:
push:
branches: [ "main", "master" ]
workflow_dispatch:
​jobs:
build-android:
runs-on: ubuntu-latest
​steps:
- name: Checkout Repository
uses: actions/checkout@v4
​- name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: 18
​- name: Setup Java JDK
uses: actions/setup-java@v4
with:
distribution: 'zulu'
java-version: '17'
​- name: Setup Android SDK
uses: android-actions/setup-android@v3
​- name: Install Cordova & Build APK
run: |
npm install -g cordova
cordova create myapp com.health.smartnutrition "SmartNutrition"
cd myapp
cordova platform add android
cp ../index.html www/index.html
cordova build android --debug
​- name: Upload APK Artifact
uses: actions/upload-artifact@v4
with:
name: SmartNutrition-App-Debug
path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
